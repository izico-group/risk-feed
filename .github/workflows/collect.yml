name: collect
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collect.py
      - name: Commit data
        run: |
          git config user.name "risk-feed-bot"
          git config user.email "risk-feed-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push -q || true
