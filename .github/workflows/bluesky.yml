name: bluesky
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bluesky.py
      - run: |
          git config user.name "risk-feed-bot"
          git config user.email "risk-feed-bot@users.noreply.github.com"
          git add data/bluesky.json
          git diff --cached --quiet || git commit -m "bluesky $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push -q || true
